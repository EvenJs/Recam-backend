version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=RempDb;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True
      - ConnectionStrings__MongoDb=mongodb://mongodb:27017
      - AzureBlobStorage__ConnectionString=UseDevelopmentStorage=true;BlobEndpoint=http://azurite:10000/devstoreaccount1
      - AzureBlobStorage__ContainerName=remp-media
      - JwtSettings__SecretKey=your-super-secret-jwt-key-at-least-32-characters
      - JwtSettings__Issuer=remp-api
      - JwtSettings__Audience=remp-client
    depends_on:
      - sqlserver
      - mongodb
      - azurite

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password123
    ports:
      - "1433:1433" # map to 1434 on host instead

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --skipApiVersionCheck --blobHost 0.0.0.0
    ports:
      - "10000:10000"
